name: Tumble
options:
  bundleIdPrefix: com.tumble
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    exactVersion: 3.70.1
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.18.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 9.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    exactVersion: 5.88.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # Persist the signing team across `xcodegen generate` so device builds
    # don't reset to "None". This is the "Aftaab Siddiqui" team.
    DEVELOPMENT_TEAM: GVGJLY2H53
    # CURRENT_PROJECT_VERSION only matters for uploads from a Mac: Xcode Cloud
    # sets CFBundleVersion from its own build number and ignores this.
    MARKETING_VERSION: "3.1.0"
    CURRENT_PROJECT_VERSION: "32"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    # Run on the Simulator with no signing/team. Device builds still use
    # Automatic signing - add your team in Signing & Capabilities for those.
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": ""

targets:
  # ---- Shared domain framework -------------------------------------------
  TumbleKit:
    type: framework
    platform: iOS
    sources:
      - TumbleKit
      - path: ../shared/film-stocks.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tumble.kit
        SWIFT_EMIT_LOC_STRINGS: NO

  # ---- Shared analytics boundary -----------------------------------------
  TumbleAnalytics:
    type: framework
    platform: iOS
    sources:
      - TumbleAnalytics
    dependencies:
      - target: TumbleKit
      - package: PostHog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tumble.analytics
        SWIFT_EMIT_LOC_STRINGS: NO

  # ---- Main app -----------------------------------------------------------
  Tumble:
    type: application
    platform: iOS
    sources:
      - Tumble
    dependencies:
      - target: TumbleKit
      - target: TumbleAnalytics
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: RevenueCat
        product: RevenueCat
    entitlements:
      path: Tumble/Tumble.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tumble
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tumble.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Tumble uses the camera when you choose to take a photo."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Tumble adds your finished edit to Photos only when you tap Save."
        POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN}
        POSTHOG_HOST: ${POSTHOG_HOST}
        # RevenueCat SDK keys identify an app and are intentionally public in
        # shipped binaries. Server credentials and private store keys stay out
        # of this project.
        REVENUECAT_API_KEY: appl_AqGfGhaCvpLnSDxjusKTULaLnKr
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Upload dSYMs to PostHog
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(EXECUTABLE_NAME)
        script: |
          if [ "$CONFIGURATION" != "Release" ]; then exit 0; fi
          if [ -z "$POSTHOG_CLI_API_KEY" ]; then
            echo "warning: POSTHOG_CLI_API_KEY is missing; skipping PostHog dSYM upload"
            exit 0
          fi
          export POSTHOG_CLI_HOST="${POSTHOG_CLI_HOST:-https://us.posthog.com}"
          export POSTHOG_CLI_PROJECT_ID="${POSTHOG_CLI_PROJECT_ID:-585380}"
          export POSTHOG_SKIP_ON_CONFLICT=1
          export PATH="$SRCROOT/.ci-bin:$PATH"
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/posthog-ios/build-tools/upload-symbols.sh"
    info:
      path: Tumble/Info.plist
      properties:
        # No non-exempt encryption — skips the export-compliance prompt on every upload.
        ITSAppUsesNonExemptEncryption: false
        POSTHOG_PROJECT_TOKEN: $(POSTHOG_PROJECT_TOKEN)
        POSTHOG_HOST: $(POSTHOG_HOST)
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.tumble.app
            CFBundleURLSchemes:
              - tumble
          - CFBundleURLName: GoogleSignIn
            CFBundleURLSchemes:
              - com.googleusercontent.apps.1093366796401-avdrcf4tokjrbtlsipun0na8gpnu25vv

  # ---- Tests --------------------------------------------------------------
  TumbleKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TumbleKitTests
    dependencies:
      - target: TumbleKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tumble.kit.tests

  TumbleAnalyticsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TumbleAnalyticsTests
    dependencies:
      - target: TumbleAnalytics
      - target: TumbleKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tumble.analytics.tests

  TumbleAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TumbleAppTests
    dependencies:
      - target: Tumble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tumble.app.tests

  TumbleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TumbleUITests
    dependencies:
      - target: Tumble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tumble.ui.tests

schemes:
  Tumble:
    build:
      targets:
        Tumble: all
        TumbleKitTests: [test]
        TumbleAnalyticsTests: [test]
    run:
      storeKitConfiguration: Tumble.storekit
    test:
      targets:
        - TumbleKitTests
        - TumbleAnalyticsTests
        - TumbleAppTests
        - TumbleUITests
      gatherCoverageData: true
